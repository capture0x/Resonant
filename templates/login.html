{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-16 hologram-effect cyber-border p-8 rounded-xl bg-black/50 backdrop-blur-lg">
    <h2 class="text-3xl text-center mb-8 text-transparent bg-clip-text bg-gradient-to-r from-purple-500 to-pink-500 animate-pulse">
        SYSTEM AUTHENTICATION
    </h2>

    <form method="POST" action="{{ url_for('login') }}" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
            <label class="block text-pink-300 mb-2 text-sm font-mono">NEURAL ID</label>
            <input type="text" name="username" class="cyber-input w-full neon-focus" required placeholder=">> ENTER CRYPTONYM">
        </div>

        <div>
            <label class="block text-pink-300 mb-2 text-sm font-mono">ACCESS CODE</label>
            <input type="password" name="password" class="cyber-input w-full neon-focus" required placeholder="••••••••">
        </div>

        <button type="submit" class="cyber-btn w-full pulse">
            VERIFY IDENTITY
        </button>
    </form>

    <div class="mt-6 text-center text-pink-300 text-sm font-mono">
        NEW OPERATOR?
        <a href="{{ url_for('register') }}" class="text-pink-400 hover:text-pink-300 ml-1 underline animate-pulse">
            REQUEST CLEARANCE
        </a>
    </div>
</div>
{% endblock %}
